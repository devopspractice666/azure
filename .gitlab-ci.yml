image:
  name: hashicorp/terraform:1.17.2
  entrypoint: [""]

stages:
  - validate
  - plan
  - apply

variables:
  TF_ROOT: ${CI_PROJECT_DIR}/terraform
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "0"
  ARM_USE_OIDC: "true"
  ARM_USE_CLI: "false"
  ARM_CLIENT_ID: "dbb75d24-124d-4ad4-ba1a-655b7d36f193"
  ARM_TENANT_ID: "ce4fe8c3-7620-4469-892f-509e9b1e1401"
  ARM_SUBSCRIPTION_ID: "8999b3c0-35d0-4d50-870d-048f32c71e67"

.terraform:
  before_script:
    - cd "${TF_ROOT}"
  rules:
    - if: $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "main"

oidc_diagnostic:
  stage: validate
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "main"
  id_tokens:
    AZURE_ID_TOKEN_DIAGNOSTIC:
      aud: api://AzureADTokenExchange
  script:
    - 'echo "GitLab version: ${CI_SERVER_VERSION:-unknown}"'
    - 'echo "Runner version: ${CI_RUNNER_VERSION:-unknown}"'
    - 'echo "Generated ID token length: ${#AZURE_ID_TOKEN_DIAGNOSTIC}"'
    - 'echo "Legacy CI_JOB_JWT length: ${#CI_JOB_JWT}"'
    - 'echo "Legacy CI_JOB_JWT_V2 length: ${#CI_JOB_JWT_V2}"'
    - 'test -n "$AZURE_ID_TOKEN_DIAGNOSTIC" || (echo "GitLab did not issue the requested ID token" && exit 1)'

fmt:
  extends: .terraform
  stage: validate
  script:
    - terraform fmt -check -recursive

validate:
  extends: .terraform
  stage: validate
  script:
    - terraform init -backend=false
    - terraform validate

plan:
  extends: .terraform
  stage: plan
  resource_group: production
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: api://AzureADTokenExchange
  before_script:
    - cd "${TF_ROOT}"
    - 'test -n "$GITLAB_OIDC_TOKEN" || (echo "ERROR: OIDC token is empty" && exit 1)'
    - printf '%s' "$GITLAB_OIDC_TOKEN" > "${CI_PROJECT_DIR}/oidc.jwt"
    - echo "OIDC token length ${#GITLAB_OIDC_TOKEN}"
  script:
    - terraform init -backend-config="use_oidc=true" -backend-config="use_cli=false" -backend-config="oidc_token_file_path=${CI_PROJECT_DIR}/oidc.jwt" -backend-config="client_id=${ARM_CLIENT_ID}" -backend-config="tenant_id=${ARM_TENANT_ID}"
    - terraform plan -out=tfplan
  artifacts:
    paths:
      - terraform/tfplan
    expire_in: 1 day

apply:
  extends: .terraform
  stage: apply
  resource_group: production
  environment:
    name: production
  needs:
    - plan
  rules:
    - if: $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "main"
      when: manual
      allow_failure: false
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: api://AzureADTokenExchange
  before_script:
    - cd "${TF_ROOT}"
    - 'test -n "$GITLAB_OIDC_TOKEN" || (echo "ERROR: OIDC token is empty" && exit 1)'
    - printf '%s' "$GITLAB_OIDC_TOKEN" > "${CI_PROJECT_DIR}/oidc.jwt"
    - echo "OIDC token length ${#GITLAB_OIDC_TOKEN}"
  script:
    - terraform init -backend-config="use_oidc=true" -backend-config="use_cli=false" -backend-config="oidc_token_file_path=${CI_PROJECT_DIR}/oidc.jwt" -backend-config="client_id=${ARM_CLIENT_ID}" -backend-config="tenant_id=${ARM_TENANT_ID}"
    - terraform apply tfplan

destroy:
  extends: .terraform
  stage: apply
  resource_group: production
  environment:
    name: production
    action: stop
  needs: []
  rules:
    - if: $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "main"
      when: manual
      allow_failure: true
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: api://AzureADTokenExchange
  before_script:
    - cd "${TF_ROOT}"
    - 'test -n "$GITLAB_OIDC_TOKEN" || (echo "ERROR: OIDC token is empty" && exit 1)'
    - printf '%s' "$GITLAB_OIDC_TOKEN" > "${CI_PROJECT_DIR}/oidc.jwt"
    - echo "OIDC token length ${#GITLAB_OIDC_TOKEN}"
  script:
    - terraform init -backend-config="use_oidc=true" -backend-config="use_cli=false" -backend-config="oidc_token_file_path=${CI_PROJECT_DIR}/oidc.jwt" -backend-config="client_id=${ARM_CLIENT_ID}" -backend-config="tenant_id=${ARM_TENANT_ID}"
    - terraform destroy -auto-approve